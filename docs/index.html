<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 A股每日选股看板</title>
<style>
  :root {
    --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
    --orange:#d29922; --purple:#bc8cff; --cyan:#39d2c0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:1200px;margin:0 auto}
  h1{font-size:1.6rem;margin-bottom:4px}
  .header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .header .badge{background:var(--border);padding:4px 12px;border-radius:20px;font-size:.82rem;color:var(--muted)}
  .header .badge.live{background:rgba(63,185,80,.15);color:var(--green)}
  .header .date{margin-left:auto;color:var(--text);font-size:.9rem}
  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;overflow-x:auto}
  .tab-btn{background:none;border:none;color:var(--muted);padding:10px 18px;font-size:.95rem;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-btn.resonance{border-radius:20px 20px 0 0;border:1px solid var(--orange);border-bottom:none;background:rgba(210,153,34,.08);color:var(--orange)}
  .tab-btn.resonance.active{background:rgba(210,153,34,.15);color:var(--orange);border-bottom-color:var(--accent)}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
  .stat-card .num{font-size:1.8rem;font-weight:700}
  .stat-card .label{color:var(--muted);font-size:.82rem;margin-top:4px}
  .stat-card.green .num{color:var(--green)}
  .stat-card.blue .num{color:var(--accent)}
  .stat-card.red .num{color:var(--red)}
  .stat-card.purple .num{color:var(--purple)}
  .stat-card.orange .num{color:var(--orange)}
  .stat-card.cyan .num{color:var(--cyan)}
  .strategy-section{margin-bottom:32px;display:none}
  .strategy-section.active{display:block}
  .strategy-section h2{font-size:1.15rem;margin-bottom:12px}
  .sub-tabs{display:flex;gap:4px;margin-bottom:16px}
  .sub-tab-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 14px;font-size:.85rem;cursor:pointer;border-radius:20px;transition:all .2s}
  .sub-tab-btn:hover{color:var(--text)}
  .sub-tab-btn.active{color:var(--text);border-color:var(--accent);background:rgba(88,166,255,.08)}
  .sub-section{display:none}
  .sub-section.active{display:block}
  .stock-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .stock-table th,.stock-table td{padding:10px 14px;text-align:left;font-size:.9rem}
  .stock-table th{background:#1c222c;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
  .stock-table tr:hover td{background:rgba(88,166,255,.04)}
  .stock-table td{border-bottom:1px solid var(--border)}
  .stock-table .ticker{font-weight:600;color:var(--accent)}
  .stock-table .name{color:var(--text);font-size:.85rem}
  .stock-table .num{font-variant-numeric:tabular-nums}
  .stock-table .signal-buy{color:var(--green)}
  .stock-table .signal-sell{color:var(--red)}
  .empty{text-align:center;padding:40px;color:var(--muted);font-size:.95rem}
  .loading{text-align:center;padding:60px;color:var(--muted)}
  .loading::after{content:'';display:inline-block;animation:dots 1.4s infinite}
  @keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
  .history-row{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .history-row select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:.85rem;cursor:pointer}
  .history-row label{font-size:.85rem;color:var(--muted)}
  .search-input{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:.85rem;width:160px}
  .search-input::placeholder{color:var(--muted)}
  @media(max-width:768px){.stock-table{font-size:.82rem}.stock-table th,.stock-table td{padding:8px 8px}}
</style>
</head>
<body>

<div class="header">
  <h1>📈 A股每日选股看板</h1>
  <span class="badge live" id="statusBadge">⏳ 加载中</span>
  <span class="date" id="headerDate"></span>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="rsi">RSI 金叉</button>
  <button class="tab-btn" data-tab="sig">EXPMA+VOL+CR</button>
  <button class="tab-btn" data-tab="ma">MA 回调</button>
  <button class="tab-btn" data-tab="stb">超级顶底</button>
  <button class="tab-btn resonance" data-tab="resonance">🔗 RSI+顶底共振</button>
  <button class="tab-btn" data-tab="history">历史数据</button>
</div>

<!-- RSI -->
<div class="strategy-section active" id="sec-rsi">
  <div class="summary" id="rsi-summary"></div>
  <div class="history-row">
    <label>日期:</label><select id="rsi-date-select"><option value="latest">✨ 最新</option></select>
    <span style="margin-left:auto"><input class="search-input" id="rsi-search" type="search" placeholder="搜索代码或名称…"></span>
  </div>
  <div id="rsi-table-area"><div class="loading">加载中</div></div>
</div>

<!-- Signals -->
<div class="strategy-section" id="sec-sig">
  <div class="summary" id="sig-summary"></div>
  <div class="history-row">
    <label>日期:</label><select id="sig-date-select"><option value="latest">✨ 最新</option></select>
    <span style="margin-left:auto"><input class="search-input" id="sig-search" type="search" placeholder="搜索代码或名称…"></span>
  </div>
  <div id="sig-table-area"><div class="loading">加载中</div></div>
</div>

<!-- MA Pullback -->
<div class="strategy-section" id="sec-ma">
  <div class="summary" id="ma-summary"></div>
  <div class="history-row">
    <label>日期:</label><select id="ma-date-select"><option value="latest">✨ 最新</option></select>
    <span style="margin-left:auto"><input class="search-input" id="ma-search" type="search" placeholder="搜索代码或名称…"></span>
  </div>
  <div id="ma-table-area"><div class="loading">加载中</div></div>
</div>

<!-- 超级顶底 -->
<div class="strategy-section" id="sec-stb">
  <div class="sub-tabs">
    <button class="sub-tab-btn active" data-stbtab="buy">🟢 买入信号</button>
    <button class="sub-tab-btn" data-stbtab="sell">🔴 卖出信号</button>
  </div>
  <div class="sub-section active" id="stb-sec-buy">
    <div class="summary" id="stb-buy-summary"></div>
    <div class="history-row">
      <label>日期:</label><select id="stb-buy-date-select"><option value="latest">✨ 最新</option></select>
      <span style="margin-left:auto"><input class="search-input" id="stb-buy-search" type="search" placeholder="搜索代码或名称…"></span>
    </div>
    <div id="stb-buy-table-area"><div class="loading">加载中</div></div>
  </div>
  <div class="sub-section" id="stb-sec-sell">
    <div class="summary" id="stb-sell-summary"></div>
    <div class="history-row">
      <label>日期:</label><select id="stb-sell-date-select"><option value="latest">✨ 最新</option></select>
      <span style="margin-left:auto"><input class="search-input" id="stb-sell-search" type="search" placeholder="搜索代码或名称…"></span>
    </div>
    <div id="stb-sell-table-area"><div class="loading">加载中</div></div>
  </div>
</div>

<!-- RSI+顶底 双重共振 -->
<div class="strategy-section" id="sec-resonance">
  <div class="summary" id="resonance-summary"></div>
  <div class="history-row">
    <label>日期:</label><select id="resonance-date-select"><option value="latest">✨ 最新</option></select>
    <span style="margin-left:auto"><input class="search-input" id="resonance-search" type="search" placeholder="搜索代码或名称…"></span>
  </div>
  <div id="resonance-table-area"><div class="loading">加载中</div></div>
</div>

<!-- History -->
<div class="strategy-section" id="sec-history">
  <h2>📅 历史筛选记录</h2>
  <div id="history-area"><div class="loading">加载历史数据中</div></div>
</div>

<script>
const BASE='./';
const RPF='screen_rsi_golden_cross_';
const SPF='screen_signals_';
const MPF='screen_ma_pullback_';
const STB_BUY='screen_super_top_bottom_buy_';
const STB_SELL='screen_super_top_bottom_sell_';
const RESF='screen_rsi_stb_resonance_';

let rsiDates=[],sigDates=[],maDates=[],stbDates=[],resDates=[];
let _names={};
let _curR=[],_curS=[],_curM=[],_curStbBuy=[],_curStbSell=[],_curRes=[];

async function loadJSON(fn){try{const r=await fetch(BASE+fn+'?t='+Date.now());return r.ok?await r.json():null}catch(e){return null}}

async function loadNames(){try{const d=await loadJSON('stock_names.json');if(d)_names=d}catch(e){}}
async function loadDates(){try{const r=await fetch(BASE+'dates.json?t='+Date.now());if(r.ok){const d=await r.json();if(d.rsi)rsiDates=d.rsi;if(d.signals)sigDates=d.signals;if(d.ma)maDates=d.ma;if(d.stb)stbDates=d.stb;if(d.resonance)resDates=d.resonance}}catch(e){}}

function fill(selId,dates){
  const s=document.getElementById(selId);
  s.innerHTML='<option value="latest">✨ 最新</option>';
  [...dates].sort().reverse().forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;s.appendChild(o)});
}

function summary(cid,data,prefix,cardClass){
  const el=document.getElementById(cid);
  const n=data?data.length:0;
  el.innerHTML=`<div class="stat-card ${cardClass||'blue'}"><div class="num">${n}</div><div class="label">${prefix||'满足条件'}</div></div>`;
}

const rsiF=[
  {key:'date',label:'日期'},
  {key:'close',label:'收盘价',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'rsi12',label:'RSI(12)'},
  {key:'rsi_ma56',label:'RSI MA(56)'},
  {key:'volume',label:'成交量',format:v=>typeof v==='number'?v.toLocaleString():v},
  {key:'mcap_yi',label:'市值(亿)',format:v=>(v!=null&&typeof v==='number')?v.toFixed(2)+'亿':'-'},
  {key:'jl_growth_pct',label:'净利增长%',format:v=>(v!=null&&typeof v==='number')?(v>=0?'+':'')+v.toFixed(2)+'%':'-'}
];
const sigF=[
  {key:'date',label:'日期'},
  {key:'close',label:'收盘价',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'ema5',label:'EMA5'},{key:'ema29',label:'EMA29'},
  {key:'vol_ma8',label:'VOL MA8',format:v=>typeof v==='number'?Math.round(v).toLocaleString():v},
  {key:'vol_ma89',label:'VOL MA89',format:v=>typeof v==='number'?Math.round(v).toLocaleString():v},
  {key:'cr',label:'CR'},
  {key:'mcap_yi',label:'市值(亿)',format:v=>(v!=null&&typeof v==='number')?v.toFixed(2)+'亿':'-'},
  {key:'jl_growth_pct',label:'净利增长%',format:v=>(v!=null&&typeof v==='number')?(v>=0?'+':'')+v.toFixed(2)+'%':'-'}
];
const maF=[
  {key:'date',label:'日期'},
  {key:'close',label:'收盘价',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'pct_change',label:'涨幅',format:v=>typeof v==='number'?(v>=0?'+':'')+v.toFixed(2)+'%':v},
  {key:'turnover_yi',label:'成交额(亿)',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'ma10',label:'MA10'},{key:'ma20',label:'MA20'},{key:'ma60',label:'MA60'},
  {key:'pullback_pct',label:'回调%',format:v=>(v!=null&&typeof v==='number')?v.toFixed(1)+'%':v},
  {key:'mcap_yi',label:'市值(亿)',format:v=>(v!=null&&typeof v==='number')?v.toFixed(2)+'亿':'-'},
  {key:'jl_growth_pct',label:'净利增长%',format:v=>(v!=null&&typeof v==='number')?(v>=0?'+':'')+v.toFixed(2)+'%':'-'}
];
const stbF=[
  {key:'date',label:'日期'},
  {key:'close',label:'收盘价',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'trend_line',label:'趋势线',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'trend_prev',label:'前日趋势线',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'signal_note',label:'信号'},
  {key:'mcap_yi',label:'市值(亿)',format:v=>(v!=null&&typeof v==='number')?v.toFixed(2)+'亿':'-'},
  {key:'jl_growth_pct',label:'净利增长%',format:v=>(v!=null&&typeof v==='number')?(v>=0?'+':'')+v.toFixed(2)+'%':'-'}
];
const resF=[
  {key:'date',label:'日期'},
  {key:'close',label:'收盘价',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'volume',label:'成交量',format:v=>typeof v==='number'?v.toLocaleString():v},
  {key:'rsi12',label:'RSI(12)'},
  {key:'rsi_ma56',label:'RSI MA(56)'},
  {key:'trend_line',label:'趋势线',format:v=>typeof v==='number'?v.toFixed(2):v},
  {key:'trend_prev',label:'前日趋势线',format:v=>(v!=null&&typeof v==='number')?v.toFixed(2):v},
  {key:'mcap_yi',label:'市值(亿)',format:v=>(v!=null&&typeof v==='number')?v.toFixed(2)+'亿':'-'},
  {key:'jl_growth_pct',label:'净利增长%',format:v=>(v!=null&&typeof v==='number')?(v>=0?'+':'')+v.toFixed(2)+'%':'-'}
];

function renderTable(cid,data,fields,q,tag){
  const el=document.getElementById(cid);
  q=(q||'').toLowerCase().trim();
  const arr=q?data.filter(s=>(s.ticker||'').includes(q)||((s.name||_names[s.ticker]||'').toLowerCase().includes(q))):data;
  if(!arr.length){el.innerHTML=q?`<div class="empty">🔍 无匹配 "${q}"</div>`:'<div class="empty">📭 暂无数据</div>';return}
  let h='<table class="stock-table"><thead><tr><th>#</th><th>代码</th><th>名称</th>';
  fields.forEach(f=>h+=`<th>${f.label}</th>`);
  h+='</tr></thead><tbody>';
  arr.forEach((s,i)=>{
    h+=`<tr><td>${i+1}</td><td class="ticker">${s.ticker}</td><td class="name">${s.name||_names[s.ticker]||''}</td>`;
    fields.forEach(f=>{let v=s[f.key]??'-';if(f.format)v=f.format(v);h+=`<td class="${f.class||'num'}">${v}</td>`});
    h+='</tr>';
  });
  h+='</tbody></table>';el.innerHTML=h;
}

// main tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.strategy-section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-'+btn.dataset.tab).classList.add('active');
  });
});

// stb sub-tabs
document.querySelectorAll('.sub-tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.parentElement.querySelectorAll('.sub-tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const sec=document.getElementById('sec-stb');
    sec.querySelectorAll('.sub-section').forEach(s=>s.classList.remove('active'));
    document.getElementById('stb-sec-'+btn.dataset.stbtab).classList.add('active');
  });
});

// search
document.getElementById('rsi-search').addEventListener('input',e=>renderTable('rsi-table-area',_curR,rsiF,e.target.value));
document.getElementById('sig-search').addEventListener('input',e=>renderTable('sig-table-area',_curS,sigF,e.target.value));
document.getElementById('ma-search').addEventListener('input',e=>renderTable('ma-table-area',_curM,maF,e.target.value));
document.getElementById('stb-buy-search').addEventListener('input',e=>renderTable('stb-buy-table-area',_curStbBuy,stbF,e.target.value));
document.getElementById('stb-sell-search').addEventListener('input',e=>renderTable('stb-sell-table-area',_curStbSell,stbF,e.target.value));
document.getElementById('resonance-search').addEventListener('input',e=>renderTable('resonance-table-area',_curRes,resF,e.target.value));

// date selects
document.getElementById('rsi-date-select').addEventListener('change',e=>refreshRsi(e.target.value));
document.getElementById('sig-date-select').addEventListener('change',e=>refreshSig(e.target.value));
document.getElementById('ma-date-select').addEventListener('change',e=>refreshMa(e.target.value));
document.getElementById('stb-buy-date-select').addEventListener('change',e=>refreshStbBuy(e.target.value));
document.getElementById('stb-sell-date-select').addEventListener('change',e=>refreshStbSell(e.target.value));
document.getElementById('resonance-date-select').addEventListener('change',e=>refreshRes(e.target.value));

async function refreshRsi(dk){
  const fn=dk==='latest'?RPF+'latest.json':RPF+dk+'.json';
  const d=await loadJSON(fn);
  _curR=(d&&d.stocks)?d.stocks:(Array.isArray(d)?d:[]);
  summary('rsi-summary',_curR,'满足条件','blue');
  renderTable('rsi-table-area',_curR,rsiF,document.getElementById('rsi-search').value);
}
async function refreshSig(dk){
  const fn=dk==='latest'?SPF+'latest.json':SPF+dk+'.json';
  const d=await loadJSON(fn);
  _curS=(d&&d.stocks)?d.stocks:(Array.isArray(d)?d:[]);
  summary('sig-summary',_curS,'满足条件','purple');
  renderTable('sig-table-area',_curS,sigF,document.getElementById('sig-search').value);
}
async function refreshMa(dk){
  const fn=dk==='latest'?MPF+'latest.json':MPF+dk+'.json';
  const d=await loadJSON(fn);
  _curM=(d&&d.stocks)?d.stocks:(Array.isArray(d)?d:[]);
  summary('ma-summary',_curM,'满足条件','cyan');
  renderTable('ma-table-area',_curM,maF,document.getElementById('ma-search').value);
}
async function refreshStbBuy(dk){
  const fn=dk==='latest'?STB_BUY+'latest.json':STB_BUY+dk+'.json';
  const d=await loadJSON(fn);
  _curStbBuy=(d&&d.stocks)?d.stocks:(Array.isArray(d)?d:[]);
  summary('stb-buy-summary',_curStbBuy,'🟢 趋势线上穿11','green');
  renderTable('stb-buy-table-area',_curStbBuy,stbF,'');
}
async function refreshStbSell(dk){
  const fn=dk==='latest'?STB_SELL+'latest.json':STB_SELL+dk+'.json';
  const d=await loadJSON(fn);
  _curStbSell=(d&&d.stocks)?d.stocks:(Array.isArray(d)?d:[]);
  summary('stb-sell-summary',_curStbSell,'🔴 趋势线下穿89','red');
  renderTable('stb-sell-table-area',_curStbSell,stbF,'');
}
async function refreshRes(dk){
  const fn=dk==='latest'?RESF+'latest.json':RESF+dk+'.json';
  const d=await loadJSON(fn);
  _curRes=(d&&d.stocks)?d.stocks:(Array.isArray(d)?d:[]);
  summary('resonance-summary',_curRes,'🔗 RSI金叉 + 超级顶底','orange');
  renderTable('resonance-table-area',_curRes,resF,'');
}

async function renderHistory(){
  const el=document.getElementById('history-area');
  if(!rsiDates.length&&!sigDates.length&&!maDates.length&&!stbDates.length&&!resDates.length){el.innerHTML='<div class="empty">暂无记录</div>';return}
  const all=[...new Set([...rsiDates,...sigDates,...maDates,...stbDates,...resDates])].sort().reverse();
  let h='<table class="stock-table"><thead><tr><th>日期</th><th>RSI金叉</th><th>多因子</th><th>MA回调</th><th>顶底买入</th><th>顶底卖出</th><th>共振</th></tr></thead><tbody>';
  for(const dt of all){
    const rd=rsiDates.includes(dt)?await loadJSON(RPF+dt+'.json'):null;
    const sd=sigDates.includes(dt)?await loadJSON(SPF+dt+'.json'):null;
    const md=maDates.includes(dt)?await loadJSON(MPF+dt+'.json'):null;
    const bdt=stbDates.includes(dt)?await loadJSON(STB_BUY+dt+'.json'):null;
    const sdt=stbDates.includes(dt)?await loadJSON(STB_SELL+dt+'.json'):null;
    const rdt=resDates.includes(dt)?await loadJSON(RESF+dt+'.json'):null;
    const rn=rd?((rd.stocks||[]).length||rd.length||0):'-';
    const sn=sd?((sd.stocks||[]).length||sd.length||0):'-';
    const mn=md?((md.stocks||[]).length||md.length||0):'-';
    const bn=bdt?((bdt.stocks||[]).length||bdt.length||0):'-';
    const sl=sdt?((sdt.stocks||[]).length||sdt.length||0):'-';
    const resN=rdt?((rdt.stocks||[]).length||rdt.length||0):'-';
    h+=`<tr><td>${dt}</td><td class="num">${rn}</td><td class="num">${sn}</td><td class="num">${mn}</td><td class="signal-buy">${bn}</td><td class="signal-sell">${sl}</td><td class="signal-sell">${resN}</td></tr>`;
  }
  h+='</tbody></table>';el.innerHTML=h;
}

async function init(){
  await Promise.all([loadNames(),loadDates()]);
  fill('rsi-date-select',rsiDates);fill('sig-date-select',sigDates);fill('ma-date-select',maDates);fill('stb-buy-date-select',stbDates);fill('stb-sell-date-select',stbDates);fill('resonance-date-select',resDates);
  await Promise.all([refreshRsi('latest'),refreshSig('latest'),refreshMa('latest'),refreshStbBuy('latest'),refreshStbSell('latest'),refreshRes('latest')]);
  const now=new Date();
  document.getElementById('headerDate').textContent='更新于 '+now.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
  document.getElementById('statusBadge').innerHTML='✅ 数据已加载';
  if(rsiDates.length||sigDates.length||maDates.length||stbDates.length||resDates.length)renderHistory();
}
init();
</script>
